name: compcert-split

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: devcontainer
      uses: ./.github/workflows/actions/devcontainer
      id: devcontainer
      with:
        variant: compcert-split
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    - name: extraction-archive
      run: |
        ${{ env.EXEC }} make compcert-extraction-archive
    - name: upload-artifact
      uses: actions/upload-artifact@v4
      with:
        name: compcert-extraction
        path: compcert-extraction.tar.gz
        retention-days: 1

  build:
    needs: generate
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: download-artifact
      uses: actions/download-artifact@v4
      with:
        name: compcert-extraction
    - name: devcontainer
      uses: ./.github/workflows/actions/devcontainer
      id: devcontainer
      with:
        variant: compcert-split
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    - name: remove-rocq
      run: |
        ${{ env.EXEC }} opam remove -y --auto-remove rocq-prover
    - name: verify-no-rocq
      run: |
        ${{ env.EXEC }} sh -c '\
          if command -v rocq >/dev/null 2>&1 || command -v coqc >/dev/null 2>&1; then \
            echo "Rocq is still present, split build is not proven Rocq-free" >&2; \
            exit 1; \
          fi'
    - name: build-from-archive
      run: |
        ${{ env.EXEC }} make compcert-build-from-archive
    - name: smoke-test
      run: |
        ${{ env.EXEC }} modules/CompCert/ccomp -version
    - name: lib-build
      run: |
        ${{ env.EXEC }} make compcert-lib-build
    - name: lib-smoke-test
      run: |
        ${{ env.EXEC }} make compcert-lib-run ARGS=-version
